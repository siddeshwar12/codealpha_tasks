name: Verify static app

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify JavaScript syntax
        run: node --check script.js
      - name: Verify static entry point
        run: test -f index.html && test -f style.css
